<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos Electrónicos</title>
    <!-- Vinculamos los estilos que creamos antes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./public/css/style.css">
</head>
<body>

    <header>
        <h1>Catálogo de Productos Electrónicos</h1>
    </header>

    <main>
        <div id="productos-container" class="container">
            <!-- Los productos se cargarán aquí automáticamente con JavaScript -->
        </div>
    </main>

    <script>
        // Función para consumir la API y mostrar los productos en pantalla
        async function cargarProductos() {
            try {
                // CORREGIDO: Usamos ruta relativa para que funcione tanto local como en Render
                const response = await fetch('/productos');
                const productos = await response.json();

                const container = document.getElementById('productos-container');
                container.innerHTML = '';

                productos.forEach(prod => {
                    const card = document.createElement('div');
                    card.className = 'card';

                    const tieneDescuento = prod.descuento > 0;
                    const precioFinal = prod.precio * (1 - prod.descuento / 100);
                    const nombreSeguro = prod.nombre.replace(/"/g, '&quot;');
                    const dinero = (n) => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

                    const rayo = `<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M13.5 2 5 13.5h5.5L9.5 22 19 9.5h-5.8z" fill="#ffd23f"/></svg>`;

                    card.innerHTML = `
                        <div class="foto">
                            <img src="${prod.imagen || ''}" alt="${nombreSeguro}">
                        </div>
                        <div class="card-content">
                            <div class="fila">
                                <span class="categoria">${prod.categoria}</span>
                                <span class="id">ID: <b>${prod.id}</b></span>
                            </div>
                            <h3>${prod.nombre}</h3>
                            <p class="descripcion"><b>Descripción:</b> ${prod.descripcion}</p>
                            <div class="bloque-precio">
                                ${tieneDescuento ? `<span class="badge">${rayo}-${prod.descuento}%</span>` : '<span class="badge-vacio"></span>'}
                                <span class="etiqueta">${tieneDescuento ? 'Precio final' : 'Precio'}</span>
                                <div class="precios">
                                    <span class="precio-final">${dinero(precioFinal)}</span>
                                    ${tieneDescuento ? `<span class="precio-original">${dinero(prod.precio)}</span>` : ''}
                                </div>
                            </div>
                        </div>
                    `;

                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error al cargar los productos:', error);
                document.getElementById('productos-container').innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: red;">Error al conectar con la API. Asegúrate de que el servidor esté encendido.</p>';
            }
        }

        // Ejecutar la función al cargar la página
        cargarProductos();
    </script>

</body>
</html>
